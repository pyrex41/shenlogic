name: ShenLogic CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  shen:
    name: Shen 41.2 (go, cl, lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Resolve pinned shen-go checkout
        run: |
          set -eu
          git clone https://github.com/pyrex41/shen-go.git ../shen-go
          git -C ../shen-go checkout --detach 77de117b139022300b598f4b0d88cc415f9b6b65
          mkdir -p ../shen-go/.bin
          go -C ../shen-go build -o .bin/shen-go ./cmd/shen

      - name: Build pinned Bifrost binary
        run: |
          set -eu
          git clone https://github.com/pyrex41/bifrost.git ../bifrost
          git -C ../bifrost checkout --detach 4fd876ebb2d5427c750d8c2e059b54d08212373c
          go -C ../bifrost build -o .bin/bifrost .

      - name: Resolve pinned shen-cl and shen-lua checkouts
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y sbcl luajit
          git clone https://github.com/pyrex41/shen-cl.git ../shen-cl
          git -C ../shen-cl checkout --detach 096543f8a96bcdafe384a6e7c7484a74ceefc03a
          make -C ../shen-cl fetch-tarver
          make -C ../shen-cl precompile SHEN="$(pwd)/../shen-go/.bin/shen-go"
          make -C ../shen-cl build-sbcl
          git clone https://github.com/pyrex41/shen-lua.git ../shen-lua
          git -C ../shen-lua checkout --detach 73d79136dd69033973657105db22d2a4c8ec37ce
          ../shen-lua/bin/shen -e '(version)'

      - name: Run Shen tests
        run: make test check

      - name: Run proof certificate gate
        run: make certify

      - name: Check solver and TPTP toolchain
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y unzip
          Z3_URL=https://github.com/Z3Prover/z3/releases/download/z3-4.15.3/z3-4.15.3-x64-glibc-2.39.zip
          Z3_SHA256=94549c5e31a75b9c543fe6eea8f32927054765c2e92e696d2d6dde0eedf348a1
          curl --proto '=https' --tlsv1.2 -fsSL "$Z3_URL" -o /tmp/z3.zip
          echo "$Z3_SHA256  /tmp/z3.zip" | sha256sum --check
          unzip -q /tmp/z3.zip -d /tmp/z3
          Z3=/tmp/z3/z3-4.15.3-x64-glibc-2.39/bin/z3
          test "$($Z3 --version)" = "Z3 version 4.15.3 - 64 bit"
          TPTP4X_REV=781de44267f9561be28dbef89dbada54129641bf
          JJPARSER_REV=14611475bb2e0e946609889167dcc5db9f93eb17
          TPTP4X_ROOT=/tmp/tptp4x
          mkdir -p "$TPTP4X_ROOT"
          git clone https://github.com/TPTPWorld/TPTP4X.git "$TPTP4X_ROOT/TPTP4X"
          git -C "$TPTP4X_ROOT/TPTP4X" checkout --detach "$TPTP4X_REV"
          git clone https://github.com/TPTPWorld/JJParser.git "$TPTP4X_ROOT/JJParser"
          git -C "$TPTP4X_ROOT/JJParser" checkout --detach "$JJPARSER_REV"
          make -C "$TPTP4X_ROOT/TPTP4X" -j2
          TPTP4X="$TPTP4X_ROOT/TPTP4X/tptp4X"
          mkdir -p build/backends
          ./bin/shenlogic translate examples/factorial.shen --format chc -o build/backends/factorial.chc
          ./bin/shenlogic translate examples/factorial.shen --format thf -o build/backends/factorial.thf
          ./bin/shenlogic query examples/factorial.shen '(factorial 5)' 120 --backend chc > build/backends/factorial-120.chc
          ./bin/shenlogic query examples/factorial.shen '(factorial 5)' 121 --backend chc > build/backends/factorial-121.chc
          "$Z3" -smt2 build/backends/factorial.chc
          test "$("$Z3" -smt2 build/backends/factorial-120.chc)" = sat
          test "$("$Z3" -smt2 build/backends/factorial-121.chc)" = unsat
          "$TPTP4X" -q1 -u machine build/backends/factorial.thf

      - name: Run cross-host suite
        run: make bifrost

  lean:
    name: Lean 4 proof checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proof project
        run: cd proof && "$HOME/.elan/bin/lake" build

  static:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy implementation files
        run: |
          set -eu
          if find . -path './.git' -prune -o -type f \( -name '*.py' -o -name 'pyproject.toml' \) -print | grep -q .; then
            echo 'Legacy implementation files are not permitted.' >&2
            exit 1
          fi
      - name: Check clean-room and license files
        run: test -s LICENSE && test -s CLEANROOM.md && test -s README.md
      - name: Shell syntax and deterministic package checks
        run: |
          set -eu
          sh -n bin/shenlogic
          SOURCE_DATE_EPOCH=0 make package
          test -s dist/SHA256SUMS

  yggdrasil-stage1:
    name: Yggdrasil stage1 Go packaging (release/nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Resolve pinned Yggdrasil checkout
        run: |
          set -eu
          git clone https://github.com/pyrex41/yggdrasil.git ../yggdrasil
          git -C ../yggdrasil checkout --detach f3f7f9bdb72680719544f1cba7b1298608e20112
          mkdir -p ../yggdrasil/.bin
          GOFLAGS=-mod=mod go -C ../yggdrasil build -o .bin/yggdrasil .
      - name: Run isolated stage1 target
        env:
          GOFLAGS: -mod=mod
        run: make yggdrasil-stage1
